name: release

# Run it from the Actions tab with a version: it bumps Cargo.toml, commits, tags and releases.
# Pushing a v* tag yourself still releases that tag as it is.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, like 0.2.0"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole history and its tags, for the changelog

      - name: Bump version, commit and tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          v="${VERSION#v}"
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like 1.2.3, got '$VERSION'"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "::error::tag v$v already exists"; exit 1
          fi
          # the first version line is the package's own, under [package]
          sed -i "0,/^version = \".*\"/s//version = \"$v\"/" Cargo.toml
          cargo update --workspace # Cargo.lock keeps the package's version too
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release v$v"
          git tag "v$v"
          git push --atomic origin "HEAD:$GITHUB_REF_NAME" "v$v"
          echo "TAG=v$v" >> "$GITHUB_ENV"

      - name: Use the pushed tag
        if: github.event_name == 'push'
        shell: bash
        run: echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"

      - name: Build serenebar.exe
        run: cargo build --release --locked

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $ver = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          & $iscc "/DAppVersion=$ver" installer\serenebar.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: serenebar-installer
          path: target/installer/*.exe

      # every commit since the previous tag (or since the start), minus the release commit itself
      - name: Changelog
        shell: bash
        run: |
          prev=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          {
            echo "## Changes"
            echo
            git log --no-merges --invert-grep --grep='^chore: release v' \
              --pretty='- %s (%h)' ${prev:+"$prev.."}"$TAG"
          } > changelog.md
          cat changelog.md

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: target/installer/*.exe
          body_path: changelog.md
